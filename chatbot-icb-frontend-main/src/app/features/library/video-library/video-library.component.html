<section class="library">

  <!-- ── Barra de herramientas ── -->
  <header class="toolbar">

    <mat-form-field appearance="outline" class="search">
      <mat-label>Buscar</mat-label>
      <input matInput placeholder="Derivadas, límites, matrices..."
             [value]="query()" (input)="updateQuery($event)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <!-- Botón filtros + panel -->
    <div class="filter-wrap">
      <button class="filter-btn" [class.active]="isFiltered()" (click)="togglePanel()">
        <mat-icon>tune</mat-icon>
        <span>Filtros</span>
        <span class="filter-dot" *ngIf="isFiltered()"></span>
        <mat-icon class="chevron" [class.open]="panelOpen()">expand_more</mat-icon>
      </button>

      <!-- Badge tema activo -->
      <div class="active-tag" *ngIf="isFiltered()">
        <span>{{ selectedTema() }}</span>
        <button class="clear-btn" (click)="selectTema('Todos')">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Panel desplegable -->
      <div class="filter-panel" *ngIf="panelOpen()">
        <p class="panel-title">Tema</p>
        <div class="panel-grid">
          <button
            class="panel-item"
            [class.selected]="selectedTema() === 'Todos'"
            (click)="selectTema('Todos')">
            Todos
          </button>
          <button
            class="panel-item"
            *ngFor="let t of temas()"
            [class.selected]="selectedTema() === t"
            (click)="selectTema(t)">
            {{ t }}
          </button>
        </div>
      </div>
    </div>

    <!-- Contador de resultados -->
    <span class="result-count" *ngIf="!loading()">
      {{ filtered().length }} video{{ filtered().length !== 1 ? 's' : '' }}
    </span>

  </header>

  <!-- Loading -->
  <div *ngIf="loading()" class="state-center">
    <mat-spinner [diameter]="36"></mat-spinner>
    <p>Cargando videos...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error() && !loading()" class="state-center error-state">
    <mat-icon>wifi_off</mat-icon>
    <p>No se pudo conectar con el servidor.</p>
  </div>

  <!-- Sin resultados -->
  <div *ngIf="!loading() && !error() && filtered().length === 0" class="state-center">
    <mat-icon>videocam_off</mat-icon>
    <p>No hay videos para este filtro.</p>
  </div>

  <!-- Grid de videos -->
  <div class="grid" *ngIf="!loading() && filtered().length > 0">
    <div class="vid-card" *ngFor="let v of filtered()">
      <ng-container *ngIf="getYouTubeId(v.url) as ytId; else plainLink">
        <a [href]="v.url" target="_blank" rel="noopener" class="thumb-link">
          <img [src]="'https://img.youtube.com/vi/' + ytId + '/hqdefault.jpg'" class="thumb" alt="Video" />
          <div class="play-overlay"><mat-icon>play_circle_filled</mat-icon></div>
        </a>
      </ng-container>
      <ng-template #plainLink>
        <a [href]="v.url" target="_blank" rel="noopener" class="plain-link">
          <mat-icon>open_in_new</mat-icon> Ver video
        </a>
      </ng-template>
      <div class="vid-meta">
        <span class="vid-tema">{{ v.tema }}</span>
      </div>
    </div>
  </div>

</section>
