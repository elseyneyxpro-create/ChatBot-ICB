<div class="auth-page-bg">
  <div class="bg-overlay"></div>

  <!-- Barra superior: marca Axiomante · institución -->
  <header class="login-topbar">
    <div class="topbar-brand">
      <span class="brand-mark"><mat-icon>auto_awesome</mat-icon></span>
      <span class="brand-text">AXIOMANTE</span>
    </div>
    <div class="topbar-udp">
      <span class="topbar-udp-badge">UDP</span>
      <span class="topbar-udp-text">Instituto de<br>Ciencias Básicas</span>
    </div>
  </header>

  <!-- Login centrado -->
  <section class="login-center">
    <div class="login-tagline">
      <h1>Hola, soy <span class="gradient">Axiomante</span></h1>
      <p>Tu tutor de Cálculo con IA para la Universidad Diego Portales</p>
    </div>

    <div class="login-card">
      <div class="card-head">
        <span class="card-mark"><mat-icon>auto_awesome</mat-icon></span>
        <div>
          <h2>Iniciar sesión</h2>
          <p>Ingresa con tu cuenta institucional para empezar.</p>
        </div>
      </div>

      <div *ngIf="errorMessage()" class="error-banner">
        <mat-icon>warning</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>

      <button class="btn-google" type="button" (click)="loginWithGoogle()" aria-label="Ingresar con Google">
        <span class="g-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="20" height="20">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
          </svg>
        </span>
        Entrar con Google (&#64;mail.udp.cl)
      </button>

      <p class="login-hint"><mat-icon>lock</mat-icon> Solo cuentas &#64;mail.udp.cl autorizadas</p>
    </div>
  </section>
</div>
